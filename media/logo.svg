<svg width="96" height="96" viewBox="0 0 96 96" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- A tag, with its eyelet.

       The ramp is the PCFHub mark's own, verbatim, so this sits in the family rather
       than beside it. Declared in userSpaceOnUse and spanning the whole 96
       canvas, so the mark reads as one object lit from the top right.

       Drawn for 32px, and the two discarded attempts are the reason for both
       the angle and the emptiness.

       Horizontal, point to the left, with the eyelet and a label bar inside it,
       the mark is a BACK ARROW. That is not a near miss: at 32 the point and
       the bar line up into a shaft and the eyelet disappears into it. Rotating
       it 45 degrees fixed the arrow and the label bar then made it a PENCIL,
       the bar reading as the barrel and the point as the tip.

       Dropping the bar is what settled it. A tag with nothing on it but the
       eyelet is a tag; the plural in the control's name is carried by the docs,
       not by drawing three of them at 4px each.

       Note: no double hyphen may appear in this comment, or the whole document
       fails to parse as XML. -->
  <defs>
    <linearGradient id="tag-list-ramp" x1="10" y1="80" x2="88" y2="16" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A684FF"/><stop offset="0.6" stop-color="#7C86FF"/><stop offset="1" stop-color="#00BCFF"/>
    </linearGradient>
  </defs>
  <g transform="rotate(-45 48 48)">
    <!-- The tag. -->
    <path d="M18 48 L36 27 A10 10 0 0 1 44 24 L72 24 A11 11 0 0 1 83 35 L83 61 A11 11 0 0 1 72 72 L44 72 A10 10 0 0 1 36 69 Z"
          fill="url(#tag-list-ramp)"/>

    <!-- The eyelet, and nothing else. -->
    <circle cx="39" cy="48" r="7.5" fill="#F8FAFC"/>
  </g>
</svg>
